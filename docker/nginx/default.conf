server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 1024m;

    # Applied to PHP, static files, media, and error responses. HTTPS/HSTS
    # must be configured on the TLS-terminating reverse proxy, not this
    # internal HTTP listener.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'" always;

    # Only Media's public file namespace is exposed. Other modules (and PHP
    # packages) are never reachable through nginx, despite sharing a volume.
    location ^~ /assets/uploads/media/ {
        alias /var/www/html/writable/modules-data/data/media/;
        if ($uri ~* \.(php[0-9]*|phtml|phar)(/|$)) { return 403; }
        if ($uri ~ /\.) { return 404; }
        try_files $uri =404;
    }

    location ^~ /assets/uploads/ { return 404; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_PROXY "";
    }

    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
