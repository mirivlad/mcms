name: mCMS checks

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, gd, intl, mbstring, mysqli, pdo_mysql, sqlite3, zip
          tools: composer:v2
      - name: Validate Composer manifest
        run: composer validate --no-check-lock
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Lint application PHP
        run: find app src modules themes -name '*.php' -type f -print0 | xargs -0 -n1 php -l
      - name: Run Core unit tests
        run: composer test
      - name: Verify Spark bootstrap and routes
        run: |
          php spark list
          php spark routes
      - name: Guard modular migration boundary
        run: |
          if grep -R --line-number --fixed-strings 'migrate --all' docker app src modules; then
            echo 'mCMS Core must never auto-run all namespaces'
            exit 1
          fi
      - name: Guard self-contained frontend
        run: |
          if grep -R --line-number --fixed-strings 'cdn.jsdelivr.net' app public modules themes; then
            echo 'Runtime frontend assets must be served locally'
            exit 1
          fi
      - name: Validate Compose model
        env:
          MCMS_DB_PASSWORD: ci-test
          MCMS_DB_ROOT_PASSWORD: ci-test-root
        run: |
          docker compose config -q
          docker compose -f portainer-stack.yml config -q
          docker compose config --format json | python3 .github/scripts/storage-contract-check.py
          docker compose -f portainer-stack.yml config --format json | python3 .github/scripts/storage-contract-check.py
