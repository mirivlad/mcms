name: mCMS clean install smoke

on:
  push:
    branches: [bootstrap/generalize]
  pull_request:

permissions:
  contents: read

concurrency:
  group: mcms-clean-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-install:
    runs-on: ubuntu-latest
    env:
      MCMS_DB_PASSWORD: ci-test
      MCMS_DB_ROOT_PASSWORD: ci-test-root
      MCMS_HTTP_PORT: 8080
      MCMS_BASE_URL: http://127.0.0.1:8080/
    steps:
      - uses: actions/checkout@v4

      - name: Build and start a clean stack
        run: docker compose up -d --build db app web

      - name: Wait for HTTP health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/_health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Verify Core, Settings and Shield tables
        run: |
          tables="$(docker compose exec -T db mariadb             -umcms -pci-test mcms             --batch --skip-column-names             -e 'SHOW TABLES')"

          printf '%s\n' "$tables"

          for table in migrations mcms_modules settings users auth_identities auth_groups_users; do
            printf '%s\n' "$tables" | grep -Fx "$table"
          done

      - name: Complete browser installer
        run: |
          curl -fsS             -c /tmp/mcms.cookies             http://127.0.0.1:8080/install             -o /tmp/install.html

          grep -q 'Initial setup' /tmp/install.html
          curl -fsS http://127.0.0.1:8080/assets/vendor/bootstrap/css/bootstrap.min.css -o /dev/null
          curl -fsS http://127.0.0.1:8080/assets/vendor/bootstrap/js/bootstrap.bundle.min.js -o /dev/null
          curl -fsS http://127.0.0.1:8080/assets/vendor/tabler/tabler.min.css -o /dev/null
          curl -fsS http://127.0.0.1:8080/assets/vendor/tabler/tabler.min.js -o /dev/null

          csrf="$(python3 - <<'PY'
          from html.parser import HTMLParser

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.token = None

              def handle_starttag(self, tag, attrs):
                  if tag != 'input':
                      return
                  values = dict(attrs)
                  if values.get('name') == 'csrf_test_name':
                      self.token = values.get('value')

          parser = Parser()
          with open('/tmp/install.html', encoding='utf-8') as handle:
              parser.feed(handle.read())

          if not parser.token:
              raise SystemExit('CSRF token not found')

          print(parser.token)
          PY
          )"

          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             -L             --data-urlencode "csrf_test_name=$csrf"             --data-urlencode "site_name=CI Test mCMS"             --data-urlencode "email=admin@example.test"             --data-urlencode "username=admin"             --data-urlencode "password=Correct-Horse-Battery-Staple-42!"             --data-urlencode "password_confirm=Correct-Horse-Battery-Staple-42!"             --data-urlencode "allow_registration=1"             http://127.0.0.1:8080/install             -o /tmp/admin.html

          grep -q 'Dashboard' /tmp/admin.html
          grep -q 'mCMS is running' /tmp/admin.html

      - name: Verify Core administration routes
        run: |
          for path in users access modules settings system; do
            code="$(curl -sS               -b /tmp/mcms.cookies               -o "/tmp/admin-${path}.html"               -w '%{http_code}'               "http://127.0.0.1:8080/admin/${path}")"

            test "$code" = "200"
          done

          grep -q 'Users' /tmp/admin-users.html
          grep -q 'Access control' /tmp/admin-access.html
          grep -q 'Modules' /tmp/admin-modules.html
          grep -q 'Settings' /tmp/admin-settings.html
          grep -q 'System' /tmp/admin-system.html

      - name: Verify superadmin membership and settings
        run: |
          count="$(docker compose exec -T db mariadb             -umcms -pci-test mcms             --batch --skip-column-names             -e 'SELECT COUNT(*) FROM auth_groups_users WHERE `group`="superadmin";')"

          test "$count" = "1"

          settings="$(docker compose exec -T db mariadb             -umcms -pci-test mcms             --batch --skip-column-names             -e 'SELECT COUNT(*) FROM settings;')"

          test "$settings" -ge "2"

      - name: Verify installer is closed after setup
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/install)"
          test "$code" = "302"

      - name: Verify updater is idempotent
        run: docker compose exec -T app php spark mcms:update

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down -v
