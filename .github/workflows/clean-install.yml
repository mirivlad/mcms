name: mCMS clean install smoke

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: mcms-clean-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-install:
    runs-on: ubuntu-latest
    env:
      MCMS_DB_PASSWORD: ci-test
      MCMS_DB_ROOT_PASSWORD: ci-test-root
      MCMS_HTTP_PORT: 8080
      MCMS_BASE_URL: http://127.0.0.1:8080/
    steps:
      - uses: actions/checkout@v4

      - name: Verify unified storage mounts
        run: docker compose config --format json | python3 .github/scripts/storage-contract-check.py

      - name: Build and start a clean stack
        run: docker compose up -d --build db app web

      - name: Wait for HTTP health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/_health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Verify Core, Settings and Shield tables
        run: |
          tables="$(docker compose exec -T db mariadb             -umcms -pci-test mcms             --batch --skip-column-names             -e 'SHOW TABLES')"

          printf '%s\n' "$tables"

          for table in migrations mcms_modules settings users auth_identities auth_groups_users; do
            printf '%s\n' "$tables" | grep -Fx "$table"
          done

          if printf '%s\n' "$tables" | grep -Fx media_files; then
            echo 'Media schema must not exist before the module is enabled'
            exit 1
          fi

          if printf '%s\n' "$tables" | grep -Fx pages; then
            echo 'Pages schema must not exist before the module is enabled'
            exit 1
          fi

          for table in menus menu_items; do
            if printf '%s\n' "$tables" | grep -Fx "$table"; then
              echo "Menus schema must not exist before the module is enabled: $table"
              exit 1
            fi
          done

      - name: Complete browser installer
        run: |
          curl -fsS             -c /tmp/mcms.cookies             http://127.0.0.1:8080/install             -o /tmp/install.html

          grep -q 'Initial setup' /tmp/install.html
          curl -fsS http://127.0.0.1:8080/assets/vendor/bootstrap/css/bootstrap.min.css -o /dev/null
          curl -fsS http://127.0.0.1:8080/assets/vendor/bootstrap/js/bootstrap.bundle.min.js -o /dev/null
          curl -fsS http://127.0.0.1:8080/assets/vendor/tabler/tabler.min.css -o /dev/null
          curl -fsS http://127.0.0.1:8080/assets/vendor/tabler/tabler.min.js -o /dev/null
          curl -fsS http://127.0.0.1:8080/assets/vendor/tabler-icons/tabler-icons.min.css -o /dev/null
          curl -fsS http://127.0.0.1:8080/assets/vendor/tabler-icons/fonts/tabler-icons.woff2 -o /dev/null
          test "$(curl -fsS http://127.0.0.1:8080/assets/themes/mcms-default/css/theme.css | wc -c)" -gt 1000
          test "$(curl -fsS http://127.0.0.1:8080/assets/themes/mcms-default/screenshot.svg | wc -c)" -gt 500

          csrf="$(python3 .github/scripts/extract-csrf.py /tmp/install.html)"

          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             -L             --data-urlencode "csrf_test_name=$csrf"             --data-urlencode "site_name=CI Test mCMS"             --data-urlencode "locale=en"             --data-urlencode "email=admin@example.test"             --data-urlencode "username=admin"             --data-urlencode "password=Correct-Horse-Battery-Staple-42!"             --data-urlencode "password_confirm=Correct-Horse-Battery-Staple-42!"             --data-urlencode "allow_registration=1"             http://127.0.0.1:8080/install             -o /tmp/admin.html

          grep -q 'Dashboard' /tmp/admin.html
          grep -q 'mCMS is running' /tmp/admin.html
          grep -q 'ti-home' /tmp/admin.html

          curl -fsS http://127.0.0.1:8080/ -o /tmp/public-home.html
          grep -q 'data-theme="mcms-default"' /tmp/public-home.html
          grep -q 'CI Test mCMS' /tmp/public-home.html

      - name: Verify Core administration routes
        run: |
          for path in users access modules themes settings system; do
            code="$(curl -sS               -b /tmp/mcms.cookies               -o "/tmp/admin-${path}.html"               -w '%{http_code}'               "http://127.0.0.1:8080/admin/${path}")"

            test "$code" = "200"
          done

          grep -q 'Users' /tmp/admin-users.html
          grep -q 'Access control' /tmp/admin-access.html
          grep -q 'Media' /tmp/admin-modules.html
          grep -q 'Pages' /tmp/admin-modules.html
          grep -q 'Menus' /tmp/admin-modules.html
          grep -q 'Stock' /tmp/admin-modules.html
          grep -q 'Cart' /tmp/admin-modules.html
          grep -q 'Orders' /tmp/admin-modules.html
          grep -q 'Delivery' /tmp/admin-modules.html
          grep -q 'Not installed' /tmp/admin-modules.html
          grep -q 'Themes' /tmp/admin-themes.html
          grep -q 'mCMS Default' /tmp/admin-themes.html
          grep -q 'Active' /tmp/admin-themes.html
          grep -q 'Primary navigation' /tmp/admin-themes.html
          grep -q 'Settings' /tmp/admin-settings.html
          grep -q 'System' /tmp/admin-system.html

      - name: Switch site locale through Core settings
        run: |
          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             http://127.0.0.1:8080/admin/settings             -o /tmp/settings-en.html
          csrf="$(python3 .github/scripts/extract-csrf.py /tmp/settings-en.html)"

          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             -L             --data-urlencode "csrf_test_name=$csrf"             --data-urlencode "site_name=CI Test mCMS"             --data-urlencode "locale=ru"             --data-urlencode "allow_registration=1"             http://127.0.0.1:8080/admin/settings             -o /tmp/settings-ru.html

          grep -q 'Настройки' /tmp/settings-ru.html
          grep -q 'Язык сайта' /tmp/settings-ru.html

          curl -fsS             -b /tmp/mcms.cookies             http://127.0.0.1:8080/admin/modules             -o /tmp/modules-ru.html
          grep -q 'Модули' /tmp/modules-ru.html
          grep -q 'Медиа' /tmp/modules-ru.html
          grep -q 'Страницы' /tmp/modules-ru.html
          grep -q 'Меню' /tmp/modules-ru.html
          grep -q 'Не установлен' /tmp/modules-ru.html

          csrf="$(python3 .github/scripts/extract-csrf.py /tmp/settings-ru.html)"
          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             -L             --data-urlencode "csrf_test_name=$csrf"             --data-urlencode "site_name=CI Test mCMS"             --data-urlencode "locale=en"             --data-urlencode "allow_registration=1"             http://127.0.0.1:8080/admin/settings             -o /tmp/settings-en-restored.html

          grep -q 'Settings' /tmp/settings-en-restored.html

      - name: Verify superadmin membership and settings
        run: |
          count="$(docker compose exec -T db mariadb             -umcms -pci-test mcms             --batch --skip-column-names             -e 'SELECT COUNT(*) FROM auth_groups_users WHERE `group`="superadmin";')"

          test "$count" = "1"

          settings="$(docker compose exec -T db mariadb             -umcms -pci-test mcms             --batch --skip-column-names             -e 'SELECT COUNT(*) FROM settings;')"

          test "$settings" -ge "3"

      - name: Enable Media through Modules UI
        run: |
          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             http://127.0.0.1:8080/admin/modules             -o /tmp/modules.html

          csrf="$(python3 .github/scripts/extract-csrf.py /tmp/modules.html)"

          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             -L             --data-urlencode "csrf_test_name=$csrf"             http://127.0.0.1:8080/admin/modules/media/enable             -o /tmp/modules-enabled.html

          enabled="$(docker compose exec -T db mariadb             -umcms -pci-test mcms             --batch --skip-column-names             -e 'SELECT enabled FROM mcms_modules WHERE module_id="media";')"

          echo "media enabled state: [$enabled]"
          test "$enabled" = "1"

          tables="$(docker compose exec -T db mariadb             -umcms -pci-test mcms             --batch --skip-column-names             -e 'SHOW TABLES LIKE "media_files";')"

          echo "media table lookup: [$tables]"
          test "$tables" = "media_files"

          code="$(curl -sS             -b /tmp/mcms.cookies             -o /tmp/media.html             -w '%{http_code}'             http://127.0.0.1:8080/admin/media)"

          echo "GET /admin/media status: [$code]"
          if [ "$code" != "200" ]; then
            echo '--- /tmp/modules-enabled.html ---'
            grep -nE 'alert|Media|Enabled|Not installed|error|Exception' /tmp/modules-enabled.html || true
            echo '--- /tmp/media.html ---'
            cat /tmp/media.html || true
          fi

          test "$code" = "200"
          grep -q 'Media' /tmp/media.html
          grep -q 'Upload file' /tmp/media.html

      - name: Upload and serve a Media image
        run: |
          printf '%s'             'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Zl6AAAAAASUVORK5CYII='             | base64 -d > /tmp/smoke.png

          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             http://127.0.0.1:8080/admin/media             -o /tmp/media-upload-form.html

          csrf="$(python3 .github/scripts/extract-csrf.py /tmp/media-upload-form.html)"

          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             -L             -F "csrf_test_name=$csrf"             -F "file=@/tmp/smoke.png;type=image/png"             -F "title=Smoke image"             -F "alt_text=Smoke test image"             http://127.0.0.1:8080/admin/media/upload             -o /tmp/media-after-upload.html

          grep -q 'Smoke image' /tmp/media-after-upload.html

          count="$(docker compose exec -T db mariadb             -umcms -pci-test mcms             --batch --skip-column-names             -e 'SELECT COUNT(*) FROM media_files;')"

          test "$count" = "1"

          media_url="$(grep -oE '/assets/uploads/media/[0-9]{4}/[0-9]{2}/[a-f0-9]{32}\.png'             /tmp/media-after-upload.html | head -n1)"

          test -n "$media_url"
          printf '%s' "$media_url" > /tmp/media-url

          curl -fsS "http://127.0.0.1:8080${media_url}" -o /tmp/downloaded.png
          cmp /tmp/smoke.png /tmp/downloaded.png

          # Public URL is unchanged; bytes now live inside modules_data.
          relative="${media_url#/assets/uploads/media/}"
          docker compose exec -T app test -f "/var/www/html/writable/modules-data/data/media/$relative"
          docker compose exec -T app test -d /var/www/html/writable/modules-data/data/media
          docker compose exec -T app test -d /var/www/html/writable/themes-data
          private_code="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/assets/uploads/product-images/secret.txt)"
          test "$private_code" = "404"

          php_code="$(curl -sS             -o /dev/null             -w '%{http_code}'             http://127.0.0.1:8080/assets/uploads/media/probe.php)"

          test "$php_code" = "403"

      - name: Disable and re-enable Media without losing data
        run: |
          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             http://127.0.0.1:8080/admin/modules             -o /tmp/modules-disable.html

          csrf="$(python3 .github/scripts/extract-csrf.py /tmp/modules-disable.html)"

          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             -L             --data-urlencode "csrf_test_name=$csrf"             http://127.0.0.1:8080/admin/modules/media/disable             -o /tmp/modules-disabled.html

          code="$(curl -sS             -b /tmp/mcms.cookies             -o /dev/null             -w '%{http_code}'             http://127.0.0.1:8080/admin/media)"

          test "$code" = "404"

          count="$(docker compose exec -T db mariadb             -umcms -pci-test mcms             --batch --skip-column-names             -e 'SELECT COUNT(*) FROM media_files;')"

          test "$count" = "1"

          media_url="$(cat /tmp/media-url)"
          curl -fsS "http://127.0.0.1:8080${media_url}" -o /dev/null

          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             http://127.0.0.1:8080/admin/modules             -o /tmp/modules-reenable.html

          csrf="$(python3 .github/scripts/extract-csrf.py /tmp/modules-reenable.html)"

          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             -L             --data-urlencode "csrf_test_name=$csrf"             http://127.0.0.1:8080/admin/modules/media/enable             -o /tmp/modules-reenabled.html

          curl -fsS             -b /tmp/mcms.cookies             http://127.0.0.1:8080/admin/media             -o /tmp/media-reenabled.html

          grep -q 'Smoke image' /tmp/media-reenabled.html

      - name: Enable Pages and create a published page
        run: |
          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             http://127.0.0.1:8080/admin/modules             -o /tmp/modules-pages.html

          csrf="$(python3 .github/scripts/extract-csrf.py /tmp/modules-pages.html)"

          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             -L             --data-urlencode "csrf_test_name=$csrf"             http://127.0.0.1:8080/admin/modules/pages/enable             -o /tmp/modules-pages-enabled.html

          enabled="$(docker compose exec -T db mariadb             -umcms -pci-test mcms             --batch --skip-column-names             -e 'SELECT enabled FROM mcms_modules WHERE module_id="pages";')"
          test "$enabled" = "1"

          media_enabled="$(docker compose exec -T db mariadb             -umcms -pci-test mcms             --batch --skip-column-names             -e 'SELECT enabled FROM mcms_modules WHERE module_id="media";')"
          test "$media_enabled" = "1"

          table_name="$(docker compose exec -T db mariadb             -umcms -pci-test mcms             --batch --skip-column-names             -e 'SHOW TABLES LIKE "pages";')"
          test "$table_name" = "pages"

          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             http://127.0.0.1:8080/admin/pages/create             -o /tmp/page-create.html

          grep -q 'Create page' /tmp/page-create.html
          grep -q 'Insert image from Media' /tmp/page-create.html

          csrf="$(python3 .github/scripts/extract-csrf.py /tmp/page-create.html)"

          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             -L             --data-urlencode "csrf_test_name=$csrf"             --data-urlencode "title=Smoke page"             --data-urlencode "slug=smoke-page"             --data-urlencode "body=<p>Smoke <strong>page</strong></p><script>alert(1)</script>"             --data-urlencode "status=published"             --data-urlencode "seo_title=Smoke SEO title"             --data-urlencode "seo_description=Smoke SEO description"             http://127.0.0.1:8080/admin/pages/create             -o /tmp/page-created.html

          grep -q 'Smoke page' /tmp/page-created.html
          grep -q 'Page created' /tmp/page-created.html

          count="$(docker compose exec -T db mariadb             -umcms -pci-test mcms             --batch --skip-column-names             -e 'SELECT COUNT(*) FROM pages WHERE slug="smoke-page" AND status="published";')"
          test "$count" = "1"
          page_id="$(docker compose exec -T db mariadb             -umcms -pci-test mcms             --batch --skip-column-names             -e 'SELECT id FROM pages WHERE slug="smoke-page";')"
          test -n "$page_id"

          unsafe="$(docker compose exec -T db mariadb             -umcms -pci-test mcms             --batch --skip-column-names             -e 'SELECT COUNT(*) FROM pages WHERE slug="smoke-page" AND body LIKE "%<script%";')"
          test "$unsafe" = "0"

          curl -fsS http://127.0.0.1:8080/smoke-page -o /tmp/public-page.html

          python3 - <<'PY'
          from html import unescape
          from pathlib import Path

          page = unescape(Path('/tmp/public-page.html').read_text())
          for needle in ('Smoke SEO title', 'Smoke SEO description', '<strong>page</strong>'):
              if needle not in page:
                  raise SystemExit(f'Missing public page content: {needle}\n{page}')
          PY

          curl -fsS             -b /tmp/mcms.cookies             http://127.0.0.1:8080/admin/pages/media             -o /tmp/pages-media.json
          if ! grep -Fq 'Smoke image' /tmp/pages-media.json; then
            echo 'Pages Media picker did not return the uploaded image'
            cat /tmp/pages-media.json
            exit 1
          fi

      - name: Protect Media dependency while Pages is enabled
        run: |
          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             http://127.0.0.1:8080/admin/modules             -o /tmp/modules-media-protected.html

          csrf="$(python3 .github/scripts/extract-csrf.py /tmp/modules-media-protected.html)"

          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             -L             --data-urlencode "csrf_test_name=$csrf"             http://127.0.0.1:8080/admin/modules/media/disable             -o /tmp/media-disable-blocked.html

          enabled="$(docker compose exec -T db mariadb             -umcms -pci-test mcms             --batch --skip-column-names             -e 'SELECT enabled FROM mcms_modules WHERE module_id="media";')"
          test "$enabled" = "1"
          grep -q 'depends on it' /tmp/media-disable-blocked.html

      - name: Disable and re-enable Pages without losing content
        run: |
          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             http://127.0.0.1:8080/admin/modules             -o /tmp/modules-pages-disable.html

          csrf="$(python3 .github/scripts/extract-csrf.py /tmp/modules-pages-disable.html)"

          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             -L             --data-urlencode "csrf_test_name=$csrf"             http://127.0.0.1:8080/admin/modules/pages/disable             -o /tmp/modules-pages-disabled.html

          code="$(curl -sS             -o /dev/null             -w '%{http_code}'             http://127.0.0.1:8080/smoke-page)"
          test "$code" = "404"

          count="$(docker compose exec -T db mariadb             -umcms -pci-test mcms             --batch --skip-column-names             -e 'SELECT COUNT(*) FROM pages WHERE slug="smoke-page";')"
          test "$count" = "1"

          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             http://127.0.0.1:8080/admin/modules             -o /tmp/modules-pages-reenable.html

          csrf="$(python3 .github/scripts/extract-csrf.py /tmp/modules-pages-reenable.html)"

          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             -L             --data-urlencode "csrf_test_name=$csrf"             http://127.0.0.1:8080/admin/modules/pages/enable             -o /tmp/modules-pages-reenabled.html

          curl -fsS http://127.0.0.1:8080/smoke-page -o /tmp/public-page-reenabled.html
          grep -q 'Smoke page' /tmp/public-page-reenabled.html

      - name: Enable News and publish an article
        run: |
          curl -fsS -b /tmp/mcms.cookies -c /tmp/mcms.cookies http://127.0.0.1:8080/admin/modules -o /tmp/modules-news.html
          csrf="$(python3 .github/scripts/extract-csrf.py /tmp/modules-news.html)"

          curl -fsS -b /tmp/mcms.cookies -c /tmp/mcms.cookies -L --data-urlencode "csrf_test_name=$csrf" http://127.0.0.1:8080/admin/modules/news/enable -o /tmp/modules-news-enabled.html

          enabled="$(docker compose exec -T db mariadb -umcms -pci-test mcms --batch --skip-column-names -e 'SELECT enabled FROM mcms_modules WHERE module_id="news";')"
          test "$enabled" = "1"
          table_name="$(docker compose exec -T db mariadb -umcms -pci-test mcms --batch --skip-column-names -e 'SHOW TABLES LIKE "news_articles";')"
          test "$table_name" = "news_articles"

          curl -fsS -b /tmp/mcms.cookies -c /tmp/mcms.cookies http://127.0.0.1:8080/admin/news/create -o /tmp/news-create.html
          grep -q 'Create article' /tmp/news-create.html
          grep -q 'Insert image' /tmp/news-create.html
          grep -q 'Choose from Media' /tmp/news-create.html

          curl -fsS -b /tmp/mcms.cookies http://127.0.0.1:8080/admin/news/media -o /tmp/news-media.json
          if ! grep -Fq 'Smoke image' /tmp/news-media.json; then
            echo 'News Media picker did not return the uploaded image'
            cat /tmp/news-media.json
            exit 1
          fi

          media_id="$(docker compose exec -T db mariadb -umcms -pci-test mcms --batch --skip-column-names -e 'SELECT id FROM media_files ORDER BY id LIMIT 1;')"
          test -n "$media_id"
          csrf="$(python3 .github/scripts/extract-csrf.py /tmp/news-create.html)"

          curl -fsS -b /tmp/mcms.cookies -c /tmp/mcms.cookies -L \
            --data-urlencode "csrf_test_name=$csrf" \
            --data-urlencode "title=Smoke news" \
            --data-urlencode "slug=smoke-news" \
            --data-urlencode "excerpt=Smoke news excerpt" \
            --data-urlencode "body=<p>Smoke <strong>news</strong></p><script>alert(1)</script>" \
            --data-urlencode "status=published" \
            --data-urlencode "published_at=" \
            --data-urlencode "featured_media_id=$media_id" \
            --data-urlencode "seo_title=Smoke news SEO" \
            --data-urlencode "seo_description=Smoke news description" \
            http://127.0.0.1:8080/admin/news/create -o /tmp/news-created.html

          grep -q 'Smoke news' /tmp/news-created.html
          grep -q 'News article created' /tmp/news-created.html

          count="$(docker compose exec -T db mariadb -umcms -pci-test mcms --batch --skip-column-names -e 'SELECT COUNT(*) FROM news_articles WHERE slug="smoke-news" AND status="published";')"
          test "$count" = "1"
          news_id="$(docker compose exec -T db mariadb -umcms -pci-test mcms --batch --skip-column-names -e 'SELECT id FROM news_articles WHERE slug="smoke-news";')"
          test -n "$news_id"

          unsafe="$(docker compose exec -T db mariadb -umcms -pci-test mcms --batch --skip-column-names -e 'SELECT COUNT(*) FROM news_articles WHERE slug="smoke-news" AND body LIKE "%<script%";')"
          test "$unsafe" = "0"

          curl -fsS http://127.0.0.1:8080/news -o /tmp/public-news-index.html
          grep -q 'data-theme="mcms-default"' /tmp/public-news-index.html
          grep -q 'Smoke news' /tmp/public-news-index.html
          grep -q 'Smoke news excerpt' /tmp/public-news-index.html

          curl -fsS http://127.0.0.1:8080/news/smoke-news -o /tmp/public-news-article.html
          python3 - <<'PY'
          from html import unescape
          from pathlib import Path

          article = unescape(Path('/tmp/public-news-article.html').read_text())
          for needle in ('Smoke news SEO', '<strong>news</strong>', '/assets/uploads/media/'):
              if needle not in article:
                  raise SystemExit(f'Missing public news content: {needle}\n{article}')
          PY

          curl -fsS -b /tmp/mcms.cookies http://127.0.0.1:8080/admin/news/media -o /tmp/news-media.json
          grep -q 'Smoke image' /tmp/news-media.json

      - name: Enable Menus and preserve a navigation tree
        run: |
          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             http://127.0.0.1:8080/admin/modules             -o /tmp/modules-menus.html
          csrf="$(python3 .github/scripts/extract-csrf.py /tmp/modules-menus.html)"

          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             -L             --data-urlencode "csrf_test_name=$csrf"             http://127.0.0.1:8080/admin/modules/menus/enable             -o /tmp/modules-menus-enabled.html

          enabled="$(docker compose exec -T db mariadb             -umcms -pci-test mcms             --batch --skip-column-names             -e 'SELECT enabled FROM mcms_modules WHERE module_id="menus";')"
          test "$enabled" = "1"

          for table in menus menu_items; do
            found="$(docker compose exec -T db mariadb               -umcms -pci-test mcms               --batch --skip-column-names               -e "SHOW TABLES LIKE '$table';")"
            test "$found" = "$table"
          done

          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             http://127.0.0.1:8080/admin/menus/create             -o /tmp/menu-create.html
          grep -q 'Create menu' /tmp/menu-create.html
          csrf="$(python3 .github/scripts/extract-csrf.py /tmp/menu-create.html)"

          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             -L             --data-urlencode "csrf_test_name=$csrf"             --data-urlencode "name=Primary navigation"             --data-urlencode "handle=primary"             --data-urlencode "description=Smoke navigation"             http://127.0.0.1:8080/admin/menus/create             -o /tmp/menu-created.html

          grep -q 'Menu created' /tmp/menu-created.html

          menu_id="$(docker compose exec -T db mariadb             -umcms -pci-test mcms             --batch --skip-column-names             -e 'SELECT id FROM menus WHERE handle="primary";')"
          test -n "$menu_id"
          page_id="$(docker compose exec -T db mariadb             -umcms -pci-test mcms             --batch --skip-column-names             -e 'SELECT id FROM pages WHERE slug="smoke-page";')"
          test -n "$page_id"

          curl -fsS             -b /tmp/mcms.cookies             "http://127.0.0.1:8080/admin/menus/resources?provider=pages.page&q=Smoke"             -o /tmp/menu-resources.json
          grep -q 'Smoke page' /tmp/menu-resources.json
          grep -q '/smoke-page' /tmp/menu-resources.json

          curl -fsS             -b /tmp/mcms.cookies             "http://127.0.0.1:8080/admin/menus/resources?provider=news.article&q=Smoke"             -o /tmp/menu-news-resources.json
          grep -q 'Smoke news' /tmp/menu-news-resources.json
          grep -q '/news/smoke-news' /tmp/menu-news-resources.json

          curl -fsS             -b /tmp/mcms.cookies             "http://127.0.0.1:8080/admin/menus/resources?provider=news.archive"             -o /tmp/menu-news-archive.json
          grep -q '"id":"index"' /tmp/menu-news-archive.json
          grep -q '"url":"/news"' /tmp/menu-news-archive.json

          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             "http://127.0.0.1:8080/admin/menus/${menu_id}/edit"             -o /tmp/menu-edit.html
          csrf="$(python3 .github/scripts/extract-csrf.py /tmp/menu-edit.html)"

          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             -L             --data-urlencode "csrf_test_name=$csrf"             --data-urlencode "label=Home"             --data-urlencode "target_type=custom"             --data-urlencode "target=/"             --data-urlencode "parent_id="             --data-urlencode "enabled=1"             "http://127.0.0.1:8080/admin/menus/${menu_id}/items/save"             -o /tmp/menu-home.html

          home_id="$(docker compose exec -T db mariadb             -umcms -pci-test mcms             --batch --skip-column-names             -e "SELECT id FROM menu_items WHERE menu_id=${menu_id} AND label='Home';")"
          test -n "$home_id"

          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             "http://127.0.0.1:8080/admin/menus/${menu_id}/edit"             -o /tmp/menu-edit-about.html
          csrf="$(python3 .github/scripts/extract-csrf.py /tmp/menu-edit-about.html)"

          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             -L             --data-urlencode "csrf_test_name=$csrf"             --data-urlencode "label=About"             --data-urlencode "target_type=pages.page"             --data-urlencode "target=$page_id"             --data-urlencode "parent_id="             --data-urlencode "enabled=1"             "http://127.0.0.1:8080/admin/menus/${menu_id}/items/save"             -o /tmp/menu-about.html

          about_id="$(docker compose exec -T db mariadb             -umcms -pci-test mcms             --batch --skip-column-names             -e "SELECT id FROM menu_items WHERE menu_id=${menu_id} AND label='About';")"
          test -n "$about_id"

          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             "http://127.0.0.1:8080/admin/menus/${menu_id}/edit"             -o /tmp/menu-edit-child.html
          csrf="$(python3 .github/scripts/extract-csrf.py /tmp/menu-edit-child.html)"

          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             -L             --data-urlencode "csrf_test_name=$csrf"             --data-urlencode "label=Child"             --data-urlencode "target_type=custom"             --data-urlencode "target=/smoke-page#child"             --data-urlencode "parent_id=$about_id"             --data-urlencode "enabled=1"             "http://127.0.0.1:8080/admin/menus/${menu_id}/items/save"             -o /tmp/menu-child.html

          count="$(docker compose exec -T db mariadb             -umcms -pci-test mcms             --batch --skip-column-names             -e "SELECT COUNT(*) FROM menu_items WHERE menu_id=${menu_id};")"
          test "$count" = "3"

          parent="$(docker compose exec -T db mariadb             -umcms -pci-test mcms             --batch --skip-column-names             -e "SELECT parent_id FROM menu_items WHERE menu_id=${menu_id} AND label='Child';")"
          test "$parent" = "$about_id"

          curl -fsS             -b /tmp/mcms.cookies             "http://127.0.0.1:8080/admin/menus/${menu_id}/edit"             -o /tmp/menu-tree.html
          grep -q 'Home' /tmp/menu-tree.html
          grep -q 'About' /tmp/menu-tree.html
          grep -q 'Child' /tmp/menu-tree.html

          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             http://127.0.0.1:8080/admin/themes/mcms-default             -o /tmp/theme-configure.html
          grep -q 'Menu assignments' /tmp/theme-configure.html
          grep -q 'header.primary' /tmp/theme-configure.html
          csrf="$(python3 .github/scripts/extract-csrf.py /tmp/theme-configure.html)"

          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             -L             --data-urlencode "csrf_test_name=$csrf"             --data-urlencode "location[]=header.primary"             --data-urlencode "menu_id[]=$menu_id"             --data-urlencode "location[]=footer.primary"             --data-urlencode "menu_id[]="             --data-urlencode "location[]=footer.legal"             --data-urlencode "menu_id[]="             http://127.0.0.1:8080/admin/themes/mcms-default             -o /tmp/theme-configured.html
          grep -q 'Theme menu assignments saved' /tmp/theme-configured.html

          curl -fsS http://127.0.0.1:8080/smoke-page -o /tmp/public-page-with-menu.html
          grep -q 'data-theme="mcms-default"' /tmp/public-page-with-menu.html
          grep -q '>About<' /tmp/public-page-with-menu.html
          grep -q '>Child<' /tmp/public-page-with-menu.html

          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             http://127.0.0.1:8080/admin/modules             -o /tmp/modules-menus-disable.html
          csrf="$(python3 .github/scripts/extract-csrf.py /tmp/modules-menus-disable.html)"

          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             -L             --data-urlencode "csrf_test_name=$csrf"             http://127.0.0.1:8080/admin/modules/menus/disable             -o /tmp/modules-menus-disabled.html

          code="$(curl -sS             -b /tmp/mcms.cookies             -o /dev/null             -w '%{http_code}'             http://127.0.0.1:8080/admin/menus)"
          test "$code" = "404"

          count="$(docker compose exec -T db mariadb             -umcms -pci-test mcms             --batch --skip-column-names             -e "SELECT COUNT(*) FROM menu_items WHERE menu_id=${menu_id};")"
          test "$count" = "3"

          curl -fsS http://127.0.0.1:8080/smoke-page -o /tmp/public-page-menus-disabled.html
          grep -q 'data-theme="mcms-default"' /tmp/public-page-menus-disabled.html
          if grep -q '>About<' /tmp/public-page-menus-disabled.html; then
            echo 'Assigned theme menu must disappear while Menus is disabled'
            exit 1
          fi

          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             http://127.0.0.1:8080/admin/modules             -o /tmp/modules-menus-reenable.html
          csrf="$(python3 .github/scripts/extract-csrf.py /tmp/modules-menus-reenable.html)"

          curl -fsS             -b /tmp/mcms.cookies             -c /tmp/mcms.cookies             -L             --data-urlencode "csrf_test_name=$csrf"             http://127.0.0.1:8080/admin/modules/menus/enable             -o /tmp/modules-menus-reenabled.html

          curl -fsS             -b /tmp/mcms.cookies             "http://127.0.0.1:8080/admin/menus/${menu_id}/edit"             -o /tmp/menu-tree-reenabled.html
          grep -q 'Child' /tmp/menu-tree-reenabled.html

          curl -fsS http://127.0.0.1:8080/smoke-page -o /tmp/public-page-menus-reenabled.html
          grep -q '>About<' /tmp/public-page-menus-reenabled.html
          grep -q '>Child<' /tmp/public-page-menus-reenabled.html

      - name: Verify reusable site modules through HTTP forms
        run: python3 .github/scripts/site-smoke.py --cookies /tmp/mcms.cookies

      - name: Verify catalogue and independent product images through HTTP
        run: python3 .github/scripts/catalogue-smoke.py --cookies /tmp/mcms.cookies

      - name: Verify order reports and CSV export permissions
        run: python3 .github/scripts/orders-reports-smoke.py --cookies /tmp/mcms.cookies

      - name: Verify module package review, access and installation
        run: python3 .github/scripts/module-packages-smoke.py --cookies /tmp/mcms.cookies

      - name: Verify module packages survive application recreation
        run: |
          docker compose exec -T app php spark mcms:module:pack modules/Feedback /tmp/feedback.zip
          docker compose exec -T app test -s /tmp/feedback.zip
          docker compose up -d --force-recreate app web
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/package-probe; then
              break
            fi
            sleep 2
          done
          # Sessions are container-local; authenticate again after recreation.
          curl -fsS -c /tmp/package-persist.cookies http://127.0.0.1:8080/login -o /tmp/package-login.html
          csrf="$(python3 .github/scripts/extract-csrf.py /tmp/package-login.html)"
          curl -fsS -b /tmp/package-persist.cookies -c /tmp/package-persist.cookies -L \
            --data-urlencode "csrf_test_name=$csrf" \
            --data-urlencode 'email=admin@example.test' \
            --data-urlencode 'password=Correct-Horse-Battery-Staple-42!' \
            http://127.0.0.1:8080/login -o /tmp/package-persist-admin.html
          python3 .github/scripts/module-packages-smoke.py --cookies /tmp/package-persist.cookies --phase persist

      - name: Verify module updates and recovery after failed MariaDB DDL
        run: python3 .github/scripts/module-updates-smoke.py --cookies /tmp/package-persist.cookies

      - name: Verify theme ZIP review, installation, activation and asset isolation
        run: python3 .github/scripts/theme-packages-smoke.py --cookies /tmp/package-persist.cookies

      - name: Verify themes survive application recreation and CLI packaging
        run: |
          docker compose exec -T app php spark mcms:theme:pack writable/themes-data/installed/theme-probe /tmp/theme-probe.zip
          docker compose exec -T app test -s /tmp/theme-probe.zip
          docker compose up -d --force-recreate app web
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/_health; then
              break
            fi
            sleep 2
          done
          curl -fsS -c /tmp/theme-persist.cookies http://127.0.0.1:8080/login -o /tmp/theme-login.html
          csrf="$(python3 .github/scripts/extract-csrf.py /tmp/theme-login.html)"
          curl -fsS -b /tmp/theme-persist.cookies -c /tmp/theme-persist.cookies -L \
            --data-urlencode "csrf_test_name=$csrf" \
            --data-urlencode 'email=admin@example.test' \
            --data-urlencode 'password=Correct-Horse-Battery-Staple-42!' \
            http://127.0.0.1:8080/login -o /tmp/theme-persist-admin.html
          python3 .github/scripts/theme-packages-smoke.py --cookies /tmp/theme-persist.cookies --phase persist

      - name: Verify integration API keys, snapshots and concurrent stock exchange
        run: |
          python3 .github/scripts/api-smoke.py --cookies /tmp/theme-persist.cookies --state-file /tmp/api-persist.json
          docker compose up -d --force-recreate app web
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/_health; then
              break
            fi
            sleep 2
          done
          curl -fsS -c /tmp/api-persist.cookies http://127.0.0.1:8080/login -o /tmp/api-login.html
          csrf="$(python3 .github/scripts/extract-csrf.py /tmp/api-login.html)"
          curl -fsS -b /tmp/api-persist.cookies -c /tmp/api-persist.cookies -L \
            --data-urlencode "csrf_test_name=$csrf" \
            --data-urlencode 'email=admin@example.test' \
            --data-urlencode 'password=Correct-Horse-Battery-Staple-42!' \
            http://127.0.0.1:8080/login -o /tmp/api-persist-admin.html
          python3 .github/scripts/api-smoke.py --cookies /tmp/api-persist.cookies --state-file /tmp/api-persist.json --phase persist

      - name: Verify central and original module settings share state
        run: python3 .github/scripts/settings-smoke.py --cookies /tmp/api-persist.cookies

      - name: Verify order notifications with a disposable SMTP receiver
        run: |
          cat > /tmp/notifications-compose.yaml <<'YAML'
          services:
            app:
              environment:
                MCMS_MAIL_HOST: 127.0.0.1
                MCMS_MAIL_PORT: 2526
          YAML
          docker compose -f compose.yaml -f /tmp/notifications-compose.yaml up -d --force-recreate app web
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/_health; then
              break
            fi
            sleep 2
          done
          python3 .github/scripts/notifications-smoke.py --cookies /tmp/api-persist.cookies --app-container "$(docker compose ps -q app)"
          docker compose up -d --force-recreate app web
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/_health; then
              break
            fi
            sleep 2
          done

      - name: Verify explicit one-time demo data and unchanged repeat runs
        run: python3 .github/scripts/demo-smoke.py

      - name: Verify admin backups, download and unattended CLI
        run: |
          # Other smoke scenarios recreated PHP-FPM; issue a fresh session.
          curl -fsS -c /tmp/backups.cookies http://127.0.0.1:8080/login -o /tmp/backups-login.html
          csrf="$(python3 .github/scripts/extract-csrf.py /tmp/backups-login.html)"
          curl -fsS -b /tmp/backups.cookies -c /tmp/backups.cookies -L --data-urlencode "csrf_test_name=$csrf" --data-urlencode 'email=admin@example.test' --data-urlencode 'password=Correct-Horse-Battery-Staple-42!' http://127.0.0.1:8080/login -o /tmp/backups-admin.html
          grep -q 'Dashboard' /tmp/backups-admin.html
          curl -fsS -b /tmp/backups.cookies -c /tmp/backups.cookies             http://127.0.0.1:8080/admin/backups -o /tmp/backups-page.html
          grep -q 'Create backup' /tmp/backups-page.html
          csrf="$(python3 .github/scripts/extract-csrf.py /tmp/backups-page.html)"
          curl -fsS -b /tmp/backups.cookies -c /tmp/backups.cookies -L             --data-urlencode "csrf_test_name=$csrf"             http://127.0.0.1:8080/admin/backups/create -o /tmp/backups-created.html
          grep -q 'Backup ready:' /tmp/backups-created.html
          file="$(grep -oE 'mcms-[0-9]{8}T[0-9]{6}Z-[a-f0-9]{12}\.zip' /tmp/backups-created.html | head -n1)"
          test -n "$file"
          curl -fsS -b /tmp/backups.cookies             "http://127.0.0.1:8080/admin/backups/$file/download"             -o /tmp/mcms-admin-download.zip
          python3 .github/scripts/backup-archive-check.py /tmp/mcms-admin-download.zip
          code="$(curl -sS -o /dev/null -w '%{http_code}'             "http://127.0.0.1:8080/admin/backups/$file/download")"
          test "$code" != "200"
          # The ZIP is not exposed as a static file, even with the exact name.
          code="$(curl -sS -o /dev/null -w '%{http_code}'             "http://127.0.0.1:8080/writable/backups/$file")"
          test "$code" = "404"
          docker compose exec -T app php spark mcms:backup:create --keep=2
          docker compose exec -T app php spark mcms:backup:create --keep=2
          count="$(docker compose exec -T app sh -c 'ls writable/backups/mcms-*.zip | wc -l')"
          test "$count" = "2"
          # The backups directory is independent of the archived module volumes.
          docker compose exec -T app test -d writable/backups

      - name: Verify installer is closed after setup
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/install)"
          test "$code" = "302"

      - name: Verify updater is idempotent
        run: docker compose exec -T app php spark mcms:update

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose logs
          echo '--- CodeIgniter application logs ---'
          docker compose exec -T app sh -c '
            for file in writable/logs/*.log; do
              [ -f "$file" ] || continue
              echo "### $file"
              tail -n 250 "$file"
            done
          ' || true

      - name: Stop stack
        if: always()
        run: docker compose down -v
