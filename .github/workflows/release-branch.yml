name: Tag and dispatch checked mCMS release branch

on:
  create:

permissions:
  contents: write
  actions: write

jobs:
  tag-and-dispatch:
    if: github.ref_type == 'branch' && startsWith(github.ref_name, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Verify release version, notes and unused tag
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_BRANCH#release/}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          TAG_NAME="$tag" php -r 'require "src/Core/Version.php"; if (getenv("TAG_NAME") !== "v" . \MCMS\Core\Version::VERSION) { exit(1); }'
          test -s "docs/RELEASE_${tag#v}.md"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Release tag exists: $tag" >&2
            exit 1
          fi
      - name: Create immutable tag and start full release verification
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_BRANCH#release/}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          # GITHUB_TOKEN tag pushes do not trigger 'on: push'. Explicitly
          # dispatch the existing test + package + GHCR release workflow.
          gh workflow run publish-release.yml --ref "$tag"
