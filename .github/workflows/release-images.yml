name: Publish mCMS stable Docker images

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  images:
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Check version and release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          php -r 'require "src/Core/Version.php"; $tag = getenv("RELEASE_TAG"); if ($tag !== "v" . \MCMS\Core\Version::VERSION || !preg_match("/^v[0-9]+\.[0-9]+\.[0-9]+$/D", $tag)) {fwrite(STDERR, "Release tag differs from mCMS version\n"); exit(1);}'
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build/publish application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          push: true
          tags: |
            ghcr.io/mirivlad/mcms-app:${{ github.event.release.tag_name }}
            ghcr.io/mirivlad/mcms-app:stable
      - name: Build/publish nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile
          push: true
          tags: |
            ghcr.io/mirivlad/mcms-web:${{ github.event.release.tag_name }}
            ghcr.io/mirivlad/mcms-web:stable
      - name: Mark both release images as published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          printf '{"tag":"%s","app":"ghcr.io/mirivlad/mcms-app:%s","web":"ghcr.io/mirivlad/mcms-web:%s"}\n' "$RELEASE_TAG" "$RELEASE_TAG" "$RELEASE_TAG" > mcms-images-ready.json
          gh release upload "$RELEASE_TAG" mcms-images-ready.json
