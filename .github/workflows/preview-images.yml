name: Publish mCMS preview Docker images

on:
  push:
    tags:
      - 'preview-*'

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm preview tag and prevent stable overwrite
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            preview-*) ;;
            *) echo 'Only preview-* image tags are permitted'; exit 1 ;;
          esac
          test -f src/Core/Version.php
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish application preview
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          push: true
          tags: ghcr.io/mirivlad/mcms-app:${{ github.ref_name }}
      - name: Publish nginx preview
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile
          push: true
          tags: ghcr.io/mirivlad/mcms-web:${{ github.ref_name }}
