name: Publish checked mCMS release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, gd, intl, mbstring, mysqli, pdo_mysql, zip
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify immutable version/tag correspondence
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          php -r 'require "src/Core/Version.php"; if (getenv("TAG_NAME") !== "v" . \MCMS\Core\Version::VERSION || !preg_match("/^v[0-9]+\.[0-9]+\.[0-9]+$/D", getenv("TAG_NAME"))) {fwrite(STDERR, "Tag/version mismatch\n"); exit(1);}'
          git status --porcelain
      - name: Validate and test production code
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          composer validate --no-check-lock
          composer test
          find app src modules themes -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
      - name: Build standalone package with bilingual manual
        run: |
          python3 scripts/build-shared-package.py --output dist
          python3 scripts/check-shared-package.py dist/mcms-*-shared-hosting.zip
          test -f docs/guide/ru/README.md
          test -f docs/guide/en/README.md
          (cd dist && sha256sum *-shared-hosting.zip > SHA256SUMS)
      - name: Publish public release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" dist/*-shared-hosting.zip dist/SHA256SUMS \
            --title "mCMS $TAG_NAME — Docker and shared hosting" \
            --notes-file docs/RELEASE_0.1.9.md \
            --verify-tag
