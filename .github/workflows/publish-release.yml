name: Publish checked mCMS release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, gd, intl, mbstring, mysqli, pdo_mysql, zip
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify immutable version/tag correspondence
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          php -r 'require "src/Core/Version.php"; if (getenv("TAG_NAME") !== "v" . \MCMS\Core\Version::VERSION || !preg_match("/^v[0-9]+\.[0-9]+\.[0-9]+$/D", getenv("TAG_NAME"))) {fwrite(STDERR, "Tag/version mismatch\n"); exit(1);}'
          git status --porcelain
      - name: Validate and test production code
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          composer validate --no-check-lock
          composer test
          find app src modules themes -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
      - name: Build standalone package with bilingual manual
        run: |
          python3 scripts/build-shared-package.py --output dist
          python3 scripts/check-shared-package.py dist/mcms-*-shared-hosting.zip
          test -f docs/guide/ru/README.md
          test -f docs/guide/en/README.md
          (cd dist && sha256sum *-shared-hosting.zip > SHA256SUMS)
      - name: Publish public release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" dist/*-shared-hosting.zip dist/SHA256SUMS \
            --title "mCMS $TAG_NAME — Docker and shared hosting" \
            --notes-file "docs/RELEASE_${TAG_NAME#v}.md" \
            --verify-tag

  images:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned and stable application images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          push: true
          tags: |
            ghcr.io/mirivlad/mcms-app:${{ github.ref_name }}
            ghcr.io/mirivlad/mcms-app:stable
      - name: Publish versioned and stable nginx images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile
          push: true
          tags: |
            ghcr.io/mirivlad/mcms-web:${{ github.ref_name }}
            ghcr.io/mirivlad/mcms-web:stable
      - name: Mark both images ready in the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          printf '{"tag":"%s","app":"ghcr.io/mirivlad/mcms-app:%s","web":"ghcr.io/mirivlad/mcms-web:%s"}\n' "$RELEASE_TAG" "$RELEASE_TAG" "$RELEASE_TAG" > mcms-images-ready.json
          gh release upload "$RELEASE_TAG" mcms-images-ready.json --clobber
